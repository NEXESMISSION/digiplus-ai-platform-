<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · DigiPlus AI</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ECEAE3">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Same editorial system as the landing pages. */
  :root {
    --paper: #ECEAE3;
    --paper-2: #E6E3DB;
    --ink: #0B0B0A;
    --ink-2: #35332E;
    --ink-3: #6B6862;
    --rule: rgba(11, 11, 10, .16);
    --rule-soft: rgba(11, 11, 10, .2);
    --flame: #F47B20;
    --grad: linear-gradient(135deg, #FF9A2E, #FF6400);
    --font-display: "Archivo", system-ui, sans-serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  :root:lang(ar) { --font-body: "IBM Plex Sans Arabic", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper-2); color: var(--ink);
    font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 26px 18px;
  }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--flame); }
  ::selection { background: var(--flame); color: var(--paper); }

  .wrap { width: 100%; max-width: 430px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 20px; }
  .brand img { width: 28px; height: 28px; display: block; }
  .brand b { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.03em; }

  .card { background: var(--paper); border: 1px solid var(--ink); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--ink); }
  .tabs button {
    min-height: 52px; border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); border-inline-end: 1px solid var(--rule);
  }
  .tabs button:last-child { border-inline-end: 0; }
  .tabs button:hover { color: var(--ink); background: var(--paper-2); }
  .tabs button.on { background: var(--ink); color: var(--paper); }
  .body { padding: 26px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 25px; letter-spacing: -.035em; line-height: 1.06; margin: 0 0 8px; }
  :lang(ar) h1 { letter-spacing: 0; line-height: 1.3; }
  .sub { color: var(--ink-2); margin: 0 0 22px; font-size: 14.5px; }

  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
  .field input, .field select {
    width: 100%; padding: 13px 14px; border: 1px solid var(--rule-soft); background: var(--paper-2);
    font: inherit; font-size: 15px; color: var(--ink); outline: none;
  }
  .field input::placeholder { color: var(--ink-3); opacity: .75; }
  .field input:focus, .field select:focus { border-color: var(--ink); background: #fff; }
  .field input:-webkit-autofill { -webkit-text-fill-color: var(--ink); -webkit-box-shadow: 0 0 0 1000px var(--paper-2) inset; }
  .field select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-inline-end: 38px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='none' stroke='%236B6862' stroke-width='1.6' stroke-linecap='round' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 14px center; background-size: 11px; }
  [dir="rtl"] .field select { background-position: left 14px center; }
  /* numbers, emails and passwords always read left-to-right, but stay flush with the RTL edge */
  [dir="rtl"] .field input[dir="ltr"] { text-align: right; }
  .field input.bad { border-color: #C2410C; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

  .primary {
    width: 100%; min-height: 54px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
    transition: background-color .16s, background-image .16s;
  }
  .primary:hover:not(:disabled) { background-image: var(--grad); border-color: transparent; }
  .primary:disabled { opacity: .55; cursor: default; }
  .linkish {
    border: 0; background: none; color: var(--ink-3); font: inherit; font-size: 13.5px;
    cursor: pointer; padding: 10px 0 0; width: 100%; text-align: center;
  }
  .linkish:hover { color: var(--flame); }
  .msg { font-size: 14px; margin-top: 14px; min-height: 20px; text-align: center; }
  .msg.error { color: #8A2B0B; }
  .msg.ok { color: #1D6B3E; }

  .trust { display: flex; justify-content: center; gap: 8px 18px; flex-wrap: wrap; margin-top: 18px;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .foot { text-align: center; margin-top: 18px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
  .foot a { color: var(--ink-3); }
  @media (max-width: 480px) { .body { padding: 22px; } .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="/" id="homeLink"><img src="/logo.png" alt="" width="28" height="28"><b>DigiPlus AI</b></a>
  <section class="card">
    <div class="tabs" id="tabs">
      <button type="button" data-mode="login">Se connecter</button>
      <button type="button" data-mode="signup">Créer un compte</button>
    </div>
    <div class="body">
      <form id="form" novalidate>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
        <label class="field" id="businessField"><span id="lblBusiness">Nom de votre business</span><input id="business" maxlength="120" autocomplete="organization" dir="auto" placeholder="ex. Salon Amira"></label>
        <label class="field" id="phoneField"><span id="lblPhone">Numéro de téléphone</span><input id="phone" type="tel" dir="ltr" maxlength="40" autocomplete="tel" placeholder="ex. 20 123 456"></label>
        <div class="grid-2" id="placeFields">
          <label class="field"><span id="lblCountry">Pays</span>
            <select id="country">
              <option value="Tunisie" selected>Tunisie</option>
              <option value="Algérie">Algérie</option>
              <option value="Maroc">Maroc</option>
              <option value="Libye">Libye</option>
              <option value="Égypte">Égypte</option>
              <option value="France">France</option>
              <option value="Belgique">Belgique</option>
              <option value="Suisse">Suisse</option>
              <option value="Canada">Canada</option>
              <option value="Italie">Italie</option>
              <option value="Allemagne">Allemagne</option>
              <option value="Émirats arabes unis">Émirats arabes unis</option>
              <option value="Arabie saoudite">Arabie saoudite</option>
              <option value="Qatar">Qatar</option>
              <option value="Koweït">Koweït</option>
              <option value="Autre">Autre</option>
            </select></label>
          <label class="field"><span id="lblCity">Ville</span><input id="city" maxlength="120" autocomplete="address-level2" dir="auto" placeholder="ex. Sfax"></label>
        </div>
        <label class="field" id="emailField"><span id="lblEmail">Email</span><input id="email" type="email" dir="ltr" autocomplete="email" placeholder="vous@exemple.com"></label>
        <label class="field" id="passwordField"><span id="passwordLabel">Mot de passe</span><input id="password" type="password" dir="ltr" minlength="8" autocomplete="current-password" placeholder="8 caractères minimum"></label>
        <button class="primary" id="submit" type="submit"></button>
        <button type="button" class="linkish" id="switchLink"></button>
        <div class="msg" id="msg" role="alert"></div>
      </form>
    </div>
  </section>
  <div class="trust" id="trust" hidden></div>
  <p class="foot"><a href="/" id="backLink">← Retour au site</a></p>
</main>

<script src="/vendor/supabase.js"></script>
<script src="/common.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const next = params.get('next') && params.get('next').startsWith('/') ? params.get('next') : '/app';
  let mode = location.pathname === '/signup' ? 'signup' : location.pathname === '/reset-password' ? 'reset' : 'login';
  let busy = false;

  const DICT = {
    fr: {
      home: '/', dir: 'ltr',
      tabs: ['Se connecter', 'Créer un compte'],
      labels: { business: 'Nom de votre business', phone: 'Numéro de téléphone', country: 'Pays', city: 'Ville', email: 'Email', password: 'Mot de passe', newPassword: 'Nouveau mot de passe' },
      ph: { business: 'ex. Salon Amira', phone: 'ex. 20 123 456', city: 'ex. Sfax', email: 'vous@exemple.com', password: '8 caractères minimum' },
      trust: ['7 jours gratuits', 'Sans carte bancaire', 'Prêt en 5 minutes'],
      back: '← Retour au site',
      modes: {
        login: { title: 'Content de vous revoir', sub: 'Connectez-vous pour gérer vos assistants.', submit: 'Se connecter', link: 'Mot de passe oublié ?' },
        signup: { title: 'Créez votre compte', sub: '7 jours gratuits, sans carte bancaire. Vous choisissez une offre à la fin.', submit: 'Créer mon compte', link: '' },
        forgot: { title: 'Mot de passe oublié', sub: 'Entrez votre email et nous vous envoyons un lien.', submit: 'Envoyer le lien', link: 'Retour à la connexion' },
        reset: { title: 'Choisissez un nouveau mot de passe', sub: 'Au moins 8 caractères.', submit: 'Enregistrer le mot de passe', link: '' },
      },
      err: {
        email: 'Entrez un email valide.',
        password: 'Le mot de passe doit faire au moins 8 caractères.',
        business: 'Écrivez le nom de votre business.',
        phone: 'Entrez un numéro de téléphone valide.',
        city: 'Écrivez la ville de votre business.',
        creds: 'Email ou mot de passe incorrect.',
        notConfirmed: "Confirmez d'abord votre email — regardez votre boîte mail (et les spams).",
        rate: 'Trop d’emails ont été envoyés. Attendez un peu et réessayez.',
        already: 'Un compte existe déjà avec cet email. Connectez-vous à la place.',
        generic: 'Une erreur est survenue. Réessayez.',
        badLink: 'Ce lien est invalide ou expiré. Demandez-en un nouveau depuis la page de connexion.',
      },
      msg: {
        confirm: (email) => `C'est presque fini ! Nous avons envoyé un lien de confirmation à ${email}. Ouvrez-le pour activer votre compte.`,
        sent: (email) => `Si un compte existe pour ${email}, le lien est en route.`,
        saved: 'Mot de passe enregistré. Ouverture de votre tableau de bord…',
      },
    },
    en: {
      home: '/en', dir: 'ltr',
      tabs: ['Log in', 'Create account'],
      labels: { business: 'Your business name', phone: 'Phone number', country: 'Country', city: 'City', email: 'Email', password: 'Password', newPassword: 'New password' },
      ph: { business: 'e.g. Amira Salon', phone: 'e.g. +216 20 123 456', city: 'e.g. Sfax', email: 'you@example.com', password: '8 characters minimum' },
      trust: ['7 days free', 'No card needed', 'Ready in 5 minutes'],
      back: '← Back to the site',
      modes: {
        login: { title: 'Welcome back', sub: 'Log in to manage your assistants.', submit: 'Log in', link: 'Forgot your password?' },
        signup: { title: 'Create your account', sub: '7 days free, no bank card. You choose a plan at the end.', submit: 'Create my account', link: '' },
        forgot: { title: 'Forgot your password', sub: 'Enter your email and we will send you a link.', submit: 'Send the link', link: 'Back to log in' },
        reset: { title: 'Choose a new password', sub: 'At least 8 characters.', submit: 'Save the password', link: '' },
      },
      err: {
        email: 'Enter a valid email.',
        password: 'The password must be at least 8 characters.',
        business: 'Write your business name.',
        phone: 'Enter a valid phone number.',
        city: 'Write the city of your business.',
        creds: 'Wrong email or password.',
        notConfirmed: 'Confirm your email first — check your inbox (and the spam folder).',
        rate: 'Too many emails were sent. Wait a little and try again.',
        already: 'An account already exists with this email. Log in instead.',
        generic: 'Something went wrong. Please try again.',
        badLink: 'This link is invalid or expired. Ask for a new one from the log in page.',
      },
      msg: {
        confirm: (email) => `Almost done! We sent a confirmation link to ${email}. Open it to activate your account.`,
        sent: (email) => `If an account exists for ${email}, the link is on its way.`,
        saved: 'Password saved. Opening your dashboard…',
      },
    },
    ar: {
      home: '/ar', dir: 'rtl',
      tabs: ['تسجيل الدخول', 'إنشاء حساب'],
      labels: { business: 'اسم نشاطك', phone: 'رقم الهاتف', country: 'البلد', city: 'المدينة', email: 'الإيميل', password: 'كلمة السر', newPassword: 'كلمة سر جديدة' },
      ph: { business: 'مثال: صالون أميرة', phone: 'مثال: 20 123 456', city: 'مثال: صفاقس', email: 'you@example.com', password: '8 حروف على الأقل' },
      trust: ['7 أيام مجانًا', 'بدون بطاقة بنكية', 'جاهز في 5 دقائق'],
      back: '← العودة إلى الموقع',
      modes: {
        login: { title: 'مرحبًا بعودتك', sub: 'سجّل الدخول لإدارة مساعديك.', submit: 'تسجيل الدخول', link: 'نسيت كلمة السر؟' },
        signup: { title: 'أنشئ حسابك', sub: '7 أيام مجانًا، بدون بطاقة بنكية. تختار عرضًا في النهاية.', submit: 'إنشاء حسابي', link: '' },
        forgot: { title: 'نسيت كلمة السر', sub: 'أدخل إيميلك ونرسل لك رابطًا.', submit: 'أرسل الرابط', link: 'العودة إلى تسجيل الدخول' },
        reset: { title: 'اختر كلمة سر جديدة', sub: '8 حروف على الأقل.', submit: 'حفظ كلمة السر', link: '' },
      },
      err: {
        email: 'أدخل إيميلًا صحيحًا.',
        password: 'كلمة السر يجب أن تكون 8 حروف على الأقل.',
        business: 'اكتب اسم نشاطك.',
        phone: 'أدخل رقم هاتف صحيحًا.',
        city: 'اكتب مدينة نشاطك.',
        creds: 'الإيميل أو كلمة السر غير صحيحة.',
        notConfirmed: 'أكّد إيميلك أولًا — راجع بريدك (وصندوق الرسائل غير المرغوبة).',
        rate: 'تمّ إرسال عدد كبير من الرسائل. انتظر قليلًا ثم أعد المحاولة.',
        already: 'يوجد حساب بهذا الإيميل. سجّل الدخول بدلًا من ذلك.',
        generic: 'حدث خطأ. أعد المحاولة.',
        badLink: 'هذا الرابط غير صالح أو منتهي. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.',
      },
      msg: {
        confirm: (email) => `كدنا ننتهي! أرسلنا رابط تأكيد إلى ${email}. افتحه لتنشيط حسابك.`,
        sent: (email) => `إذا كان هناك حساب بـ ${email}، فالرابط في الطريق.`,
        saved: 'تمّ حفظ كلمة السر. جاري فتح لوحة التحكم…',
      },
    },
  };

  const asked = (params.get('lang') || '').toLowerCase();
  const lang = DICT[asked] ? asked : 'fr';
  const T = DICT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = T.dir;
  const TEXT = T.modes;
  const keepLang = (path) => (lang === 'fr' ? path : `${path}?lang=${lang}`);

  function applyLang() {
    const tabs = document.querySelectorAll('#tabs button');
    tabs[0].textContent = T.tabs[0];
    tabs[1].textContent = T.tabs[1];
    $('lblBusiness').textContent = T.labels.business;
    $('lblPhone').textContent = T.labels.phone;
    $('lblCountry').textContent = T.labels.country;
    $('lblCity').textContent = T.labels.city;
    $('lblEmail').textContent = T.labels.email;
    $('business').placeholder = T.ph.business;
    $('phone').placeholder = T.ph.phone;
    $('city').placeholder = T.ph.city;
    $('email').placeholder = T.ph.email;
    $('password').placeholder = T.ph.password;
    $('trust').replaceChildren(...T.trust.map((label) => {
      const span = document.createElement('span');
      span.textContent = label;
      return span;
    }));
    $('backLink').textContent = T.back;
    $('backLink').href = T.home;
    $('homeLink').href = T.home;
  }

  function render() {
    const t = TEXT[mode];
    $('title').textContent = t.title;
    $('subtitle').textContent = t.sub;
    $('submit').textContent = t.submit;
    $('switchLink').textContent = t.link;
    $('switchLink').hidden = !t.link;
    $('tabs').hidden = mode === 'forgot' || mode === 'reset';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
    $('businessField').hidden = mode !== 'signup';
    $('phoneField').hidden = mode !== 'signup';
    $('placeFields').hidden = mode !== 'signup';
    $('emailField').hidden = mode === 'reset';
    $('passwordField').hidden = mode === 'forgot';
    $('passwordLabel').textContent = mode === 'reset' ? T.labels.newPassword : T.labels.password;
    $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    $('trust').hidden = mode !== 'signup';
    document.title = `${t.submit} · DigiPlus AI`;
    say('');
  }

  function say(text, kind = 'error') {
    $('msg').textContent = text;
    $('msg').className = `msg ${kind}`;
  }

  function friendly(error) {
    const m = String(error?.message || error || '');
    if (/invalid login credentials/i.test(m)) return T.err.creds;
    if (/email not confirmed/i.test(m)) return T.err.notConfirmed;
    if (/rate limit/i.test(m)) return T.err.rate;
    if (/already registered/i.test(m)) return T.err.already;
    return m || T.err.generic;
  }

  document.querySelectorAll('#tabs button').forEach((b) =>
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      history.replaceState(null, '', keepLang(mode === 'signup' ? '/signup' : '/login'));
      render();
    })
  );
  $('switchLink').addEventListener('click', () => {
    mode = mode === 'login' ? 'forgot' : 'login';
    render();
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;
    const email = $('email').value.trim();
    const password = $('password').value;
    if (mode !== 'reset' && !/^\S+@\S+\.\S+$/.test(email)) return say(T.err.email);
    if (mode !== 'forgot' && password.length < 8) return say(T.err.password);
    if (mode === 'signup') {
      if (!$('business').value.trim()) return say(T.err.business);
      if ($('phone').value.replace(/\D/g, '').length < 8) return say(T.err.phone);
      if (!$('city').value.trim()) return say(T.err.city);
    }

    busy = true;
    $('submit').disabled = true;
    try {
      const sb = await DP.auth();
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        location.href = next;
      } else if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: `${location.origin}/app`,
            data: {
              business_name: $('business').value.trim(),
              phone: $('phone').value.trim(),
              country: $('country').value,
              city: $('city').value.trim(),
            },
          },
        });
        if (error) throw error;
        if (data.session) location.href = '/app';
        else say(T.msg.confirm(email), 'ok');
      } else if (mode === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}/reset-password` });
        if (error) throw error;
        say(T.msg.sent(email), 'ok');
      } else if (mode === 'reset') {
        const { error } = await sb.auth.updateUser({ password });
        if (error) throw error;
        say(T.msg.saved, 'ok');
        setTimeout(() => (location.href = '/app'), 800);
      }
    } catch (err) {
      say(friendly(err));
    } finally {
      busy = false;
      $('submit').disabled = false;
    }
  });

  (async () => {
    applyLang();
    render();
    try {
      const sb = await DP.auth();
      if (mode === 'reset') {
        const { data } = await sb.auth.getSession();
        if (!data.session) say(T.err.badLink);
        return;
      }
      const { data } = await sb.auth.getSession();
      if (data.session) location.href = next;
    } catch (err) {
      say(friendly(err));
    }
  })();
})();
</script>
</body>
</html>
