<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · DigiPlus AI</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0B0F14">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F14;
    --card: #12171F;
    --field: #161D26;
    --line: rgba(255, 255, 255, .09);
    --line-strong: rgba(255, 255, 255, .16);
    --orange: #F47B20;
    --orange-2: #FF9A2E;
    --orange-deep: #FF6400;
    --cream: #FFF7EC;
    --text: #D7DEE8;
    --muted: #94A3B8;
    --green: #34D399;
    --red: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 28px 20px;
    position: relative; overflow-x: hidden;
  }
  body::before, body::after { content: ""; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
  body::before {
    width: 760px; height: 760px; right: -280px; top: -400px;
    background: radial-gradient(circle, rgba(255, 100, 0, .26) 0%, rgba(244, 123, 32, .08) 45%, transparent 70%);
  }
  body::after {
    width: 560px; height: 560px; left: -260px; bottom: -300px;
    background: radial-gradient(circle, rgba(244, 123, 32, .14) 0%, transparent 65%);
  }

  .auth-box { position: relative; z-index: 1; width: 100%; max-width: 430px; }
  .auth-brand {
    display: flex; align-items: center; justify-content: center; gap: 11px;
    margin-bottom: 22px; text-decoration: none;
    color: var(--cream); font-weight: 800; font-size: 19px; letter-spacing: -.3px;
  }
  .logo-mark { width: 38px; height: 38px; display: block; filter: drop-shadow(0 6px 16px rgba(244, 123, 32, .38)); }

  .auth-card {
    background: linear-gradient(180deg, var(--card), rgba(18, 23, 31, .72));
    border: 1px solid var(--line); border-radius: 22px; padding: 28px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
  }
  .auth-tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px; margin-bottom: 24px;
  }
  .auth-tabs button {
    border: 0; background: transparent; padding: 10px; border-radius: 999px;
    font: inherit; font-weight: 650; font-size: 14.5px; color: var(--muted); cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .auth-tabs button:hover { color: var(--cream); }
  .auth-tabs button.active { background: linear-gradient(135deg, var(--orange-2), var(--orange-deep)); color: #fff; }

  h1 { font-size: 23px; margin: 0 0 6px; color: var(--cream); font-weight: 800; letter-spacing: -.6px; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; }

  .field { display: block; margin-bottom: 16px; }
  .field > span { display: block; font-size: 13.5px; font-weight: 600; color: var(--cream); margin-bottom: 7px; }
  .field input {
    width: 100%; padding: 13px 15px; border-radius: 13px;
    background: var(--field); border: 1px solid var(--line-strong); color: var(--cream);
    font: inherit; font-size: 15px; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder { color: #64748B; }
  .field select {
    width: 100%; padding: 13px 15px; border-radius: 13px;
    background: var(--field); border: 1px solid var(--line-strong); color: var(--cream);
    font: inherit; font-size: 15px; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%2394A3B8' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 15px center; background-size: 12px; padding-right: 38px;
  }
  .field select:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(244, 123, 32, .18); }
  .field select option { background: #161D26; color: var(--cream); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field input:focus {
    outline: none; border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(244, 123, 32, .18);
  }
  .field input:-webkit-autofill {
    -webkit-text-fill-color: var(--cream);
    -webkit-box-shadow: 0 0 0 1000px var(--field) inset;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 22px; border-radius: 999px; border: 1px solid transparent;
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    background: linear-gradient(135deg, var(--orange-2), var(--orange-deep)); color: #fff;
    box-shadow: 0 10px 30px rgba(244, 123, 32, .30);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn.wide { width: 100%; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 38px rgba(244, 123, 32, .42); }
  .btn:disabled { opacity: .6; cursor: default; }

  .linkish {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
    cursor: pointer; padding: 6px 0 0; margin-top: 10px; width: 100%; text-align: center;
  }
  .linkish:hover { color: var(--orange-2); }

  .auth-msg { font-size: 14px; margin-top: 14px; min-height: 20px; text-align: center; }
  .auth-msg.error { color: var(--red); }
  .auth-msg.ok { color: var(--green); }

  .trust { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: 13.5px; }
  .trust span::before { content: "✓"; color: var(--orange); font-weight: 800; margin-right: 6px; }
  .auth-foot { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 20px; }
  .auth-foot a { color: var(--muted); text-decoration: none; }
  .auth-foot a:hover { color: var(--orange-2); }

  @media (max-width: 480px) {
    .auth-card { padding: 22px; }
    h1 { font-size: 21px; }
    .auth-tabs button { font-size: 13.5px; padding: 10px 6px; white-space: nowrap; }
    .grid-2 { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>
<main class="auth-wrap">
  <div class="auth-box">
    <a class="auth-brand" href="/"><img class="logo-mark" src="/logo.png" alt="" width="38" height="38"><span class="brand-name">DigiPlus AI</span></a>
    <section class="auth-card">
      <div class="auth-tabs" id="tabs">
        <button type="button" data-mode="login">Se connecter</button>
        <button type="button" data-mode="signup">Créer un compte</button>
      </div>
      <form id="form" novalidate>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
        <label class="field" id="businessField"><span id="lblBusiness">Nom de votre business</span><input id="business" maxlength="120" autocomplete="organization" dir="auto" placeholder="ex. Salon Amira"></label>
        <label class="field" id="phoneField"><span id="lblPhone">Numéro de téléphone</span><input id="phone" type="tel" maxlength="40" autocomplete="tel" placeholder="ex. 20 123 456"></label>
        <div class="grid-2" id="placeFields">
          <label class="field"><span id="lblCountry">Pays</span>
            <select id="country">
              <option value="Tunisie" selected>Tunisie</option>
              <option value="Algérie">Algérie</option>
              <option value="Maroc">Maroc</option>
              <option value="Libye">Libye</option>
              <option value="Égypte">Égypte</option>
              <option value="France">France</option>
              <option value="Belgique">Belgique</option>
              <option value="Suisse">Suisse</option>
              <option value="Canada">Canada</option>
              <option value="Italie">Italie</option>
              <option value="Allemagne">Allemagne</option>
              <option value="Émirats arabes unis">Émirats arabes unis</option>
              <option value="Arabie saoudite">Arabie saoudite</option>
              <option value="Qatar">Qatar</option>
              <option value="Koweït">Koweït</option>
              <option value="Autre">Autre</option>
            </select></label>
          <label class="field"><span id="lblCity">Ville</span><input id="city" maxlength="120" autocomplete="address-level2" dir="auto" placeholder="ex. Sfax"></label>
        </div>
        <label class="field" id="emailField"><span id="lblEmail">Email</span><input id="email" type="email" autocomplete="email" placeholder="vous@exemple.com"></label>
        <label class="field" id="passwordField"><span id="passwordLabel">Mot de passe</span><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="8 caractères minimum"></label>
        <button class="btn wide" id="submit" type="submit"></button>
        <button type="button" class="linkish" id="switchLink"></button>
        <div class="auth-msg" id="msg" role="alert"></div>
      </form>
    </section>
    <div class="trust" id="trust" hidden><span>7 jours gratuits</span><span>Sans carte bancaire</span><span>Prêt en 5 minutes</span></div>
    <p class="auth-foot"><a href="/" id="backLink">← Retour au site</a></p>
  </div>
</main>

<script src="/vendor/supabase.js"></script>
<script src="/common.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const next = params.get('next') && params.get('next').startsWith('/') ? params.get('next') : '/app';
  let mode = location.pathname === '/signup' ? 'signup' : location.pathname === '/reset-password' ? 'reset' : 'login';
  let busy = false;

  const DICT = {
    fr: {
      home: '/',
      tabs: ['Se connecter', 'Créer un compte'],
      labels: { business: 'Nom de votre business', phone: 'Numéro de téléphone', country: 'Pays', city: 'Ville', email: 'Email', password: 'Mot de passe', newPassword: 'Nouveau mot de passe' },
      ph: { business: 'ex. Salon Amira', phone: 'ex. 20 123 456', city: 'ex. Sfax', email: 'vous@exemple.com', password: '8 caractères minimum' },
      trust: ['7 jours gratuits', 'Sans carte bancaire', 'Prêt en 5 minutes'],
      back: '← Retour au site',
      modes: {
        login: { title: 'Content de vous revoir', sub: 'Connectez-vous pour gérer vos assistants IA.', submit: 'Se connecter', link: 'Mot de passe oublié ?' },
        signup: { title: 'Créez votre compte', sub: '7 jours gratuits, sans carte bancaire. Vous choisissez une offre à la fin des 7 jours.', submit: 'Créer mon compte', link: '' },
        forgot: { title: 'Mot de passe oublié', sub: 'Entrez votre email et nous vous envoyons un lien pour en choisir un nouveau.', submit: 'Envoyer le lien', link: 'Retour à la connexion' },
        reset: { title: 'Choisissez un nouveau mot de passe', sub: 'Au moins 8 caractères.', submit: 'Enregistrer le mot de passe', link: '' },
      },
      err: {
        email: 'Entrez un email valide.',
        password: 'Le mot de passe doit faire au moins 8 caractères.',
        business: 'Écrivez le nom de votre business.',
        phone: 'Entrez un numéro de téléphone valide.',
        city: 'Écrivez la ville de votre business.',
        creds: 'Email ou mot de passe incorrect.',
        notConfirmed: "Confirmez d'abord votre email — regardez votre boîte mail (et les spams).",
        rate: 'Trop d’emails ont été envoyés. Attendez un peu et réessayez.',
        already: 'Un compte existe déjà avec cet email. Connectez-vous à la place.',
        generic: 'Une erreur est survenue. Réessayez.',
        badLink: 'Ce lien est invalide ou expiré. Demandez-en un nouveau depuis la page de connexion.',
      },
      msg: {
        confirm: (email) => `C'est presque fini ! Nous avons envoyé un lien de confirmation à ${email}. Ouvrez-le pour activer votre compte.`,
        sent: (email) => `Si un compte existe pour ${email}, le lien est en route.`,
        saved: 'Mot de passe enregistré. Ouverture de votre tableau de bord…',
      },
    },
    en: {
      home: '/en',
      tabs: ['Log in', 'Create account'],
      labels: { business: 'Your business name', phone: 'Phone number', country: 'Country', city: 'City', email: 'Email', password: 'Password', newPassword: 'New password' },
      ph: { business: 'e.g. Amira Salon', phone: 'e.g. +216 20 123 456', city: 'e.g. Sfax', email: 'you@example.com', password: '8 characters minimum' },
      trust: ['7 days free', 'No card needed', 'Ready in 5 minutes'],
      back: '← Back to the site',
      modes: {
        login: { title: 'Welcome back', sub: 'Log in to manage your AI assistants.', submit: 'Log in', link: 'Forgot your password?' },
        signup: { title: 'Create your account', sub: '7 days free, no bank card. You choose a plan when the 7 days end.', submit: 'Create my account', link: '' },
        forgot: { title: 'Forgot your password', sub: 'Enter your email and we will send you a link to choose a new one.', submit: 'Send the link', link: 'Back to log in' },
        reset: { title: 'Choose a new password', sub: 'At least 8 characters.', submit: 'Save the password', link: '' },
      },
      err: {
        email: 'Enter a valid email.',
        password: 'The password must be at least 8 characters.',
        business: 'Write your business name.',
        phone: 'Enter a valid phone number.',
        city: 'Write the city of your business.',
        creds: 'Wrong email or password.',
        notConfirmed: 'Confirm your email first — check your inbox (and the spam folder).',
        rate: 'Too many emails were sent. Wait a little and try again.',
        already: 'An account already exists with this email. Log in instead.',
        generic: 'Something went wrong. Please try again.',
        badLink: 'This link is invalid or expired. Ask for a new one from the log in page.',
      },
      msg: {
        confirm: (email) => `Almost done! We sent a confirmation link to ${email}. Open it to activate your account.`,
        sent: (email) => `If an account exists for ${email}, the link is on its way.`,
        saved: 'Password saved. Opening your dashboard…',
      },
    },
  };

  const lang = (params.get('lang') || '').toLowerCase() === 'en' ? 'en' : 'fr';
  const T = DICT[lang];
  const TEXT = T.modes;
  document.documentElement.lang = lang;
  const keepLang = (path) => (lang === 'en' ? `${path}?lang=en` : path);

  function render() {
    const t = TEXT[mode];
    $('title').textContent = t.title;
    $('subtitle').textContent = t.sub;
    $('submit').textContent = t.submit;
    $('switchLink').textContent = t.link;
    $('switchLink').hidden = !t.link;
    $('tabs').hidden = mode === 'forgot' || mode === 'reset';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
    $('businessField').hidden = mode !== 'signup';
    $('phoneField').hidden = mode !== 'signup';
    $('placeFields').hidden = mode !== 'signup';
    $('emailField').hidden = mode === 'reset';
    $('passwordField').hidden = mode === 'forgot';
    $('passwordLabel').textContent = mode === 'reset' ? T.labels.newPassword : T.labels.password;
    $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    $('trust').hidden = mode !== 'signup';
    document.title = `${t.submit} · DigiPlus AI`;
    say('');
  }

  // The static labels are written in French in the HTML; swap them for English
  // when the page is opened as /signup?lang=en from the English site.
  function applyLang() {
    const tabs = document.querySelectorAll('#tabs button');
    tabs[0].textContent = T.tabs[0];
    tabs[1].textContent = T.tabs[1];
    $('lblBusiness').textContent = T.labels.business;
    $('lblPhone').textContent = T.labels.phone;
    $('lblCountry').textContent = T.labels.country;
    $('lblCity').textContent = T.labels.city;
    $('lblEmail').textContent = T.labels.email;
    $('business').placeholder = T.ph.business;
    $('phone').placeholder = T.ph.phone;
    $('city').placeholder = T.ph.city;
    $('email').placeholder = T.ph.email;
    $('password').placeholder = T.ph.password;
    $('trust').replaceChildren(...T.trust.map((label) => {
      const span = document.createElement('span');
      span.textContent = label;
      return span;
    }));
    $('backLink').textContent = T.back;
    $('backLink').href = T.home;
  }

  function say(text, kind = 'error') {
    $('msg').textContent = text;
    $('msg').className = `auth-msg ${kind}`;
  }

  function friendly(error) {
    const m = String(error?.message || error || '');
    if (/invalid login credentials/i.test(m)) return T.err.creds;
    if (/email not confirmed/i.test(m)) return T.err.notConfirmed;
    if (/rate limit/i.test(m)) return T.err.rate;
    if (/already registered/i.test(m)) return T.err.already;
    return m || T.err.generic;
  }

  document.querySelectorAll('#tabs button').forEach((b) =>
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      history.replaceState(null, '', keepLang(mode === 'signup' ? '/signup' : '/login'));
      render();
    })
  );
  $('switchLink').addEventListener('click', () => {
    mode = mode === 'login' ? 'forgot' : 'login';
    render();
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;
    const email = $('email').value.trim();
    const password = $('password').value;
    if (mode !== 'reset' && !/^\S+@\S+\.\S+$/.test(email)) return say(T.err.email);
    if (mode !== 'forgot' && password.length < 8) return say(T.err.password);
    if (mode === 'signup') {
      if (!$('business').value.trim()) return say(T.err.business);
      if ($('phone').value.replace(/\D/g, '').length < 8) return say(T.err.phone);
      if (!$('city').value.trim()) return say(T.err.city);
    }

    busy = true;
    $('submit').disabled = true;
    try {
      const sb = await DP.auth();
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        location.href = next;
      } else if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: `${location.origin}/app`,
            data: {
              business_name: $('business').value.trim(),
              phone: $('phone').value.trim(),
              country: $('country').value,
              city: $('city').value.trim(),
            },
          },
        });
        if (error) throw error;
        if (data.session) location.href = '/app';
        else say(T.msg.confirm(email), 'ok');
      } else if (mode === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}/reset-password` });
        if (error) throw error;
        say(T.msg.sent(email), 'ok');
      } else if (mode === 'reset') {
        const { error } = await sb.auth.updateUser({ password });
        if (error) throw error;
        say(T.msg.saved, 'ok');
        setTimeout(() => (location.href = '/app'), 800);
      }
    } catch (err) {
      say(friendly(err));
    } finally {
      busy = false;
      $('submit').disabled = false;
    }
  });

  (async () => {
    applyLang();
    render();
    try {
      const sb = await DP.auth();
      if (mode === 'reset') {
        const { data } = await sb.auth.getSession();
        if (!data.session) say(T.err.badLink);
        return;
      }
      const { data } = await sb.auth.getSession();
      if (data.session) location.href = next;
    } catch (err) {
      say(friendly(err));
    }
  })();
})();
</script>
</body>
</html>
