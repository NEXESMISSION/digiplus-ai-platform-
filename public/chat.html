<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat · DigiPlus AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8F6F3">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<div class="page">

  <!-- Wide screens: site bar above the chat -->
  <header class="topbar">
    <div class="topbar-left">
      <a class="round-btn back" href="/" data-back aria-label="Retour" title="Retour">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <a class="brand" href="/"><img src="/logo.png" alt="" width="30" height="30">DigiPlus AI</a>
    </div>
    <div class="topbar-right">
      <span class="demo-pill" data-demo hidden>Démo · essayez comme un client</span>
      <a class="cta-btn" data-demo href="/chat/digiplus" hidden>Avoir ce chat
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>
      <a class="text-link" data-not-demo href="/#tarifs" hidden>Voir les tarifs</a>
    </div>
  </header>

  <div class="layout">
    <aside class="profile" id="profile" aria-label="À propos"></aside>

    <section class="chat is-loading" aria-label="Conversation">
      <!-- Small screens: demo strip -->
      <div class="demo-bar" data-demo hidden>
        <span>Démo · essayez comme un client</span>
        <a href="/chat/digiplus">Avoir ce chat
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </a>
      </div>

      <header class="chat-head">
        <a class="back-btn" href="/" data-back aria-label="Retour" title="Retour">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="who">
          <h1 id="name"></h1>
          <p class="status"><span class="dot"></span><span>En ligne · répond en quelques secondes</span></p>
        </div>
        <button class="round-btn tinted" id="restart" type="button" aria-label="Recommencer la conversation" title="Recommencer" hidden>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4h4"/></svg>
        </button>
      </header>

      <main class="log" id="log" role="log" aria-live="polite" aria-label="Messages"></main>

      <footer class="composer">
        <!-- A shop's catalogue, always one tap away (phones and tablets) -->
        <div class="catalog-bar" id="catalog-bar" hidden></div>
        <form id="form" autocomplete="off">
          <textarea id="input" rows="1" maxlength="600" placeholder="Écrivez votre message…" enterkeyhint="send" aria-label="Votre message" disabled></textarea>
          <button class="send" id="send" type="submit" aria-label="Envoyer" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 3.5L10 14"/><path d="M20.5 3.5l-6.7 17-3.8-6.5-6.5-3.8z"/></svg>
          </button>
        </form>
        <a class="powered" href="/"><img src="/logo.png" alt="" width="13" height="13"><span>Propulsé par DigiPlus AI</span></a>
      </footer>
    </section>
  </div>
</div>

<dialog class="sheet" id="restart-dialog" aria-labelledby="restart-title">
  <form method="dialog">
    <h2 id="restart-title">Recommencer la conversation&nbsp;?</h2>
    <p>Les messages de cette conversation seront effacés.</p>
    <div class="sheet-actions">
      <button class="sheet-btn" value="cancel">Annuler</button>
      <button class="sheet-btn primary" value="confirm">Recommencer</button>
    </div>
  </form>
</dialog>

<!-- What the client sent: they can open it again from the card -->
<dialog class="sheet" id="request-sheet" aria-label="Votre demande">
  <div class="sheet-head">
    <div class="sheet-title"><h2>Votre demande</h2></div>
    <button class="round-btn" type="button" data-close aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="request-body"></div>
</dialog>

<!-- Catalogue on phones -->
<dialog class="sheet full" id="catalog-sheet" aria-label="Catalogue">
  <div class="sheet-head">
    <div class="sheet-title">
      <span id="catalog-logo"></span>
      <div>
        <h2>Catalogue</h2>
        <p id="catalog-meta"></p>
      </div>
    </div>
    <button class="round-btn" type="button" data-close aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="catalog-sheet-body"></div>
</dialog>

<!-- One product: sizes, quantity, order -->
<dialog class="sheet product" id="product-sheet" aria-labelledby="product-name">
  <div class="product-view">
    <button class="round-btn product-close" type="button" data-close aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
    <div class="product-media" id="product-media"></div>
    <div class="product-info">
      <span class="product-cat" id="product-cat"></span>
      <h2 id="product-name"></h2>
      <p id="product-desc"></p>
      <p class="product-notice" id="product-notice"></p>
      <div class="options" id="product-options" role="radiogroup" aria-label="Taille"></div>
    </div>
    <!-- Always visible, even when the description is long -->
    <div class="product-bar">
      <div class="qty" role="group" aria-label="Quantité">
        <button type="button" id="qty-minus" aria-label="Moins">−</button>
        <output id="qty-value">1</output>
        <button type="button" id="qty-plus" aria-label="Plus">+</button>
      </div>
      <button class="order-btn" type="button" id="product-order">Commander · <span id="product-total"></span></button>
    </div>
  </div>
</dialog>

<script src="/chat.js" defer></script>
<script src="/track.js" defer></script>
</body>
</html>
